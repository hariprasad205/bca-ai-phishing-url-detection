{% extends "base.html" %}

{% block title %}404 Not Found - PhishShield AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <div class="cyber-card p-5">
      <div class="text-warning mb-3">
        <i class="bi bi-question-circle fs-1"></i>
      </div>
      <h2 class="text-white fw-bold">404 - Page Not Found</h2>
      <p class="text-secondary mb-4">
        The requested URL, scan audit record, or dataset could not be located on the server.
      </p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-cyber-primary">
        <i class="bi bi-house me-1"></i> Return to Safety
      </a>
    </div>
  </div>
</div>
{% endblock %}
