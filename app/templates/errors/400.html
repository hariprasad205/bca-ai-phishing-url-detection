{% extends "base.html" %}

{% block title %}400 Bad Request - PhishShield AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <div class="cyber-card p-5">
      <div class="text-warning mb-3">
        <i class="bi bi-exclamation-triangle fs-1"></i>
      </div>
      <h2 class="text-white fw-bold">400 - Bad Request</h2>
      <p class="text-secondary mb-4">
        The request was malformed, missing required CSRF tokens, or invalid.
      </p>
      <a href="{{ url_for('main.index') }}" class="btn btn-cyber-primary">
        <i class="bi bi-house me-1"></i> Return to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
