{% extends "base.html" %}

{% block title %}500 Internal Server Error - PhishShield AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <div class="cyber-card p-5">
      <div class="text-danger mb-3">
        <i class="bi bi-gear-wide-connected fs-1"></i>
      </div>
      <h2 class="text-white fw-bold">500 - Internal Server Error</h2>
      <p class="text-secondary mb-4">
        An unexpected error occurred while processing your request. The system state has been preserved.
      </p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-cyber-primary">
        <i class="bi bi-house me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
